# Tamad Strategy scanner configuration (v2 — Python-only detection).
#
# Any string may reference environment variables with ${VAR}. Keep secrets
# (tokens) in the environment / .env — never in this file.

app:
  host: 127.0.0.1
  port: 8081            # /health endpoint only

exchange:
  name: MEXC
  tv_prefix: MEXC       # TradingView exchange prefix (MEXC:BTCUSDT.P)
  market: USDT Perpetual

scanner:
  # Timeframes in minutes. A sweep runs whenever a candle of any of these
  # timeframes closes. 10m is built by aggregating 2x5m MEXC candles.
  timeframes: ["5", "10", "15", "30", "60"]
  symbols:
    mode: all           # all | whitelist
    whitelist: []       # e.g. ["BTCUSDT.P", "ETHUSDT.P"] when mode: whitelist
  # Candles fetched per (symbol, timeframe): S/R context + pattern candles.
  # Keep >= left_bars + right_bars + 10.
  history_bars: 150
  # Wait after a candle-close boundary before sweeping, so MEXC has
  # published the final candle.
  boundary_settle_seconds: 5
  # Reject setups whose candle 3 closed longer ago than this — a stale
  # signal is not tradeable. Must comfortably exceed the sweep duration.
  max_signal_age_seconds: 600
  # Allowance for clock drift when confirming candle 3 has fully closed.
  clock_skew_seconds: 30
  # How often the active-contract list is refreshed.
  symbol_refresh_seconds: 3600

mexc:
  base_url: https://contract.mexc.com
  # Token bucket for the public market-data endpoints; keep conservative
  # (MEXC allows roughly 20 requests / 2 s per IP).
  requests_per_second: 8
  max_concurrency: 8
  retries: 3
  timeout_seconds: 15

strategy:
  equal_close:
    # Max difference between candle 1 and candle 2 closes, in percent.
    # This is the main sensitivity knob: raise it for more candidates,
    # lower it for stricter "equal" closes.
    tolerance_percent: 0.1
    # How the exact level is derived from the two near-equal closes:
    #   outer    — the far edge of the zone the two closes span (default:
    #              candle 3 may close anywhere inside the equal-close zone;
    #              matches reading the two closes as one S/R *area*)
    #   midpoint — midpoint of the two closes
    #   strict   — the close candle 3 is least allowed to break (harshest)
    # ("average" is intentionally not offered: with two candles it equals
    #  the midpoint — see ARCHITECTURE.md, decision D2.)
    comparison_mode: outer
  # "Potential setup" alerts: the exact candle color sequence on fully
  # closed candles is still mandatory, but these two bounds may stretch.
  # Such alerts are clearly labeled 🟡 near-miss and list their deviations.
  near_miss:
    enabled: true
    # Relaxed equal-close bound (strict bound is tolerance_percent above).
    tolerance_percent: 0.25
    # Candle 3 may close beyond the level by at most this much, in percent.
    overshoot_percent: 0.1
  support_resistance:
    # Optional confirmation that the pattern formed at a meaningful S/R
    # level. DISABLED: patterns anywhere on the chart qualify, and the
    # alert checklist drops the S/R row (6 rules instead of 7).
    # Re-enable by setting this to true — the settings below then apply.
    enabled: false
    # Only swing_high_low is implemented; fractals, daily/weekly high-low
    # and pivots plug in behind the same interface later.
    method: swing_high_low
    left_bars: 20        # bars left of a swing that it must exceed
    right_bars: 20       # bars right of a swing (confirmation lag)
    # Pattern level must sit within this % of a confirmed S/R level;
    # middle-of-range patterns are rejected.
    proximity_percent: 0.25
  # R multiples for the displayed targets (TP2 = 2R, TP3 = 3R).
  risk_reward_targets: [2.0, 3.0]

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  retries: 3
  timeout_seconds: 30

screenshots:
  provider: playwright             # playwright | disabled
  # python_overlay — Pillow-drawn highlights/levels/legend (default;
  #                  auto-degrades to legend-only when pixel calibration
  #                  fails on a capture)
  # legend_only    — clean chart + legend panel with all trade details
  # none           — raw chart screenshot
  annotations: python_overlay
  # What to do when the screenshot cannot be captured at all:
  #   send_without_image — deliver the alert with a warning line
  #   skip_alert         — do not alert at all (strictest)
  on_failure: send_without_image
  # Annotated PNGs are persisted here; the path is stored with each signal.
  output_dir: screenshots/out
  playwright:
    # Point this at YOUR saved TradingView chart layout, e.g.
    # https://www.tradingview.com/chart/AbCdEfGh/  — symbol and interval are
    # switched via URL parameters, your saved appearance is kept.
    chart_url: https://www.tradingview.com/chart/
    # Playwright storage state exported after logging in to TradingView
    # (required for private layouts; see README).
    storage_state_path: config/tv_storage_state.json
    # Leave empty to use Playwright's own Chromium.
    executable_path: ""
    viewport: { width: 1600, height: 900 }
    render_wait_seconds: 6
    timeout_seconds: 60
    retries: 2

database:
  path: database/tamad.sqlite3

logging:
  level: INFO
  file: logs/tamad.log
  max_bytes: 10485760
  backup_count: 5
