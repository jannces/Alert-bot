[project]
name = "tamad-strategy-scanner"
version = "1.0.0"
description = "MEXC USDT-perp market scanner: TradingView-driven Tamad Strategy detection with Telegram alerts. Notification-only — never trades."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
screenshots = ["playwright>=1.45"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 92
target-version = "py311"
