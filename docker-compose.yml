services:
  tamad-scanner:
    build: .
    restart: unless-stopped          # automatic recovery after any failure
    env_file: .env
    ports:
      - "8080:8080"                  # /health endpoint
    volumes:
      - ./database:/app/database     # dedup + scan state survive restarts
      - ./logs:/app/logs
      - ./config:/app/config         # config.yaml + tv_storage_state.json
      - ./screenshots/out:/app/screenshots/out
